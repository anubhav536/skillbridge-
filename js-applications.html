<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications | SkillBridge AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="universal.css">
  <style>
    .page-top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.75rem; margin-bottom:1.25rem; }
    .page-top h1 { margin:0; }

    .filter-bar { display:flex; gap:.75rem; margin-bottom:1rem; flex-wrap:wrap; }
    .filter-bar input  { flex:1; min-width:180px; margin:0; }
    .filter-bar select { width:155px; margin:0; }

    .mini-stats { display:flex; gap:.75rem; margin-bottom:1.1rem; flex-wrap:wrap; }
    .mini-card {
      background:rgba(18,12,48,.72); border:1px solid rgba(124,58,237,.22);
      border-radius:12px; padding:.75rem 1.1rem;
      display:flex; align-items:center; gap:.5rem;
    }
    .mini-card span { font-size:22px; font-weight:800; color:#c4b5fd; }
    .mini-card small { font-size:13px; color:#a78bfa; }

    .apps-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }

    .app-card {
      background:rgba(18,12,48,.72); border:1px solid rgba(124,58,237,.22); border-radius:16px;
      padding:1.2rem; display:flex; flex-direction:column; gap:.5rem;
      position:relative; overflow:hidden; transition:box-shadow .25s;
    }
    .app-card:hover { box-shadow:0 0 28px rgba(124,58,237,.2); }
    .app-card::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; }
    .before-applied     { background:linear-gradient(90deg,#7c3aed,#4f46e5); }
    .before-shortlisted { background:linear-gradient(90deg,#4ade80,#16a34a); }
    .before-hired       { background:linear-gradient(90deg,#4ade80,#16a34a); }
    .before-rejected    { background:linear-gradient(90deg,#f87171,#dc2626); }

    .app-top { display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem; }
    .app-top h3 { font-size:15px; font-weight:700; color:#f5f3ff; margin:0; line-height:1.3; }

    .status-badge {
      font-size:12px; font-weight:700; padding:.25rem .65rem;
      border-radius:999px; white-space:nowrap; flex-shrink:0;
    }
    .status-applied     { background:rgba(124,58,237,.15); border:1px solid rgba(124,58,237,.35); color:#c4b5fd; }
    .status-shortlisted { background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.35); color:#4ade80; }
    .status-hired       { background:rgba(34,197,94,.12);  border:1px solid rgba(34,197,94,.35);  color:#4ade80; }
    .status-rejected    { background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3); color:#f87171; }
    .status-pending     { background:rgba(245,158,11,.1);  border:1px solid rgba(245,158,11,.3);  color:#fcd34d; }

    .app-info { font-size:13.5px; color:#c4b5fd; }
    .app-info b { color:#a78bfa; }

    /* Match score */
    .match-row { display:flex; align-items:center; gap:.55rem; margin:.1rem 0; }
    .match-bar-wrap { flex:1; height:5px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
    .match-bar-fill { height:100%; border-radius:99px; transition:width .6s ease; }
    .match-pct { font-size:12px; font-weight:800; min-width:34px; text-align:right; }
    .match-lbl { font-size:11px; font-weight:600; padding:.15rem .5rem; border-radius:999px; border:1px solid currentColor; opacity:.8; }

    .empty-box { color:#a78bfa; text-align:center; padding:3rem 1rem; font-size:14px; grid-column:1/-1; }
  </style>
</head>

<body class="apps-page">
<div class="dashboard">

  <aside class="sidebar">
    <h2>👨‍🎓 Job Seeker Panel</h2>
    <nav>
      <a href="js-dashboard.html">Dashboard</a>
      <a href="js-jobs.html">Jobs</a>
      <a href="js-applications.html" class="active">Applications</a>
      <a href="js-resume.html">Resume Builder</a>
      <a href="js-analytics.html">Analytics</a>
      <a href="career-gap.html">🧠 AI Career Gap</a>
      <a href="js-profile.html">Profile</a>
    </nav>
    <button id="logoutBtn">Logout 👋</button>
  </aside>

  <main class="main">

    <div class="page-top">
      <div>
        <h1>📄 My Applications</h1>
        <p style="color:#a78bfa;font-size:14px;margin:.2rem 0 0">Your job hunt command center 🎯</p>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="search">
      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="Applied">Applied</option>
        <option value="Shortlisted">Shortlisted</option>
        <option value="Hired">Hired</option>
        <option value="Rejected">Rejected</option>
      </select>
      <select id="sortFilter">
        <option value="new">Most Recent</option>
        <option value="old">Oldest First</option>
        <option value="score">Highest Match</option>
      </select>
    </div>

    <div class="mini-stats">
      <div class="mini-card"><span id="totalCount">0</span><small>Total</small></div>
      <div class="mini-card"><span id="shortCount">0</span><small>Shortlisted</small></div>
      <div class="mini-card"><span id="hireCount">0</span><small>Hired</small></div>
    </div>

    <section id="appsContainer" class="apps-grid">
      <div class="empty-box">Loading...</div>
    </section>

  </main>
</div>

<script type="module">
import { db, logoutUser, getSession, protectPage } from "./firebase.js";
import { getDocs, collection } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

protectPage("jobseeker");
document.getElementById("logoutBtn").addEventListener("click", logoutUser);

let allApps = [];

async function loadApplications() {
  const container = document.getElementById("appsContainer");
  container.innerHTML = `<div class="empty-box">Loading...</div>`;

  const user = getSession();
  if (!user) { window.location.href = "jobseeker-login.html"; return; }

  try {
    const snap = await getDocs(collection(db, "applications"));
    allApps = [];
    snap.forEach(d => {
      const app = d.data();
      if (app.seeker === user.email || app.user === user.email || app.email === user.email) {
        allApps.push({ id: d.id, ...app });
      }
    });
    updateStats();
    applyFilters();
  } catch(err) {
    console.error(err);
    container.innerHTML = `<div class="empty-box">Error loading applications ❌</div>`;
  }
}

function updateStats() {
  document.getElementById("totalCount").textContent = allApps.length;
  document.getElementById("shortCount").textContent = allApps.filter(a => a.status === "Shortlisted").length;
  document.getElementById("hireCount").textContent  = allApps.filter(a => a.status === "Hired").length;
}

function applyFilters() {
  const search = document.getElementById("search").value.toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const sort   = document.getElementById("sortFilter").value;

  let filtered = [...allApps];

  if (search) {
    filtered = filtered.filter(a =>
      (a.jobTitle || "").toLowerCase().includes(search) ||
      (a.recruiter || "").toLowerCase().includes(search)
    );
  }
  if (status !== "all") filtered = filtered.filter(a => a.status === status);

  filtered.sort((a, b) => {
    if (sort === "score") return (b.matchScore || 0) - (a.matchScore || 0);
    if (sort === "old")   return (a.createdAt || 0) - (b.createdAt || 0);
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  renderApps(filtered);
}

function renderApps(apps) {
  const container = document.getElementById("appsContainer");

  if (apps.length === 0) {
    container.innerHTML = `<div class="empty-box">No applications found 😶<br><small>Start applying from the <a href="js-jobs.html" style="color:#c4b5fd">Jobs page</a></small></div>`;
    return;
  }

  container.innerHTML = apps.map(app => {
    const status    = app.status || "Applied";
    const statusKey = status.toLowerCase();
    const score     = app.matchScore;

    let matchBar = "";
    if (score !== undefined && score !== null) {
      const col = score >= 80 ? "#4ade80" : score >= 60 ? "#a78bfa" : score >= 40 ? "#f59e0b" : "#f87171";
      const lbl = score >= 80 ? "Excellent" : score >= 60 ? "Good" : score >= 40 ? "Fair" : "Low";
      matchBar = `
        <div class="match-row">
          <div class="match-bar-wrap"><div class="match-bar-fill" style="width:${score}%;background:${col}"></div></div>
          <span class="match-pct" style="color:${col}">${score}%</span>
          <span class="match-lbl" style="color:${col};border-color:${col}">${lbl} Match</span>
        </div>`;
    }

    return `
    <div class="app-card">
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${
        statusKey === "hired" || statusKey === "shortlisted" ? "linear-gradient(90deg,#4ade80,#16a34a)"
        : statusKey === "rejected" ? "linear-gradient(90deg,#f87171,#dc2626)"
        : "linear-gradient(90deg,#7c3aed,#4f46e5)"
      }"></div>
      <div class="app-top">
        <h3>${app.jobTitle || "Unknown Job"}</h3>
        <span class="status-badge status-${statusKey}">${status}</span>
      </div>
      <p class="app-info"><b>Recruiter:</b> ${app.recruiter || "N/A"}</p>
      <p class="app-info"><b>Applied:</b> ${app.createdAt ? new Date(app.createdAt).toLocaleDateString() : "N/A"}</p>
      ${matchBar}
      ${app.skills?.length ? `<p class="app-info"><b>Skills:</b> ${(Array.isArray(app.skills) ? app.skills : [app.skills]).slice(0,4).join(", ")}</p>` : ""}
    </div>`;
  }).join("");
}

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);
document.getElementById("sortFilter").addEventListener("change", applyFilters);

loadApplications();
</script>
<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
