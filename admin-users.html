<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge AI</title>


  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="universal.css">
</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

<h2>👑 Admin</h2>

<nav>
<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="admin-users.html" class="active">👥 Users</a>
<a href="admin-jobs.html">💼 Jobs</a>
<a href="admin-applications.html">📄 Apps</a>
<a href="admin-flags.html">🚨 Flags</a>
<a href="admin-analytics.html">📈 Analytics</a>
<a href="admin-ai-control.html">🤖 AI</a>
<a href="admin-leaderboard.html">🏆 Rank</a>
<a href="admin-settings.html">⚙ Settings</a>

<a href="admin-moderation.html">🛠 Mod</a>
</nav>

<a href="index.html" class="btn">Logout 👋</a>

</aside>

<!-- MAIN -->
<main class="main">

<!-- TOP -->
<div class="page-top">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <h1>👥 All Users</h1>
  <input type="text" id="searchUser" >
</div>

<!-- USERS LIST -->
<div id="usersList" class="grid"></div>

</main>

</div>

<script type="module">
import { logoutUser, getSession, observeUsersRealtime, approveAdminUser } from "./firebase.js";

document.querySelector(".btn").addEventListener("click", logoutUser);

const container = document.getElementById("usersList");
const searchInput = document.getElementById("searchUser");
let allUsers = [];

function cardMarkup(u) {
  const pending = u.role === "admin_pending";
  return `
    <div class="user-card" data-search="${`${u.name || ""} ${u.email || ""} ${u.role || ""}`.toLowerCase()}">
      <h3>👤 ${u.name || "No Name"}</h3>
      <p>📧 ${u.email || "No Email"}</p>
      <span class="role-badge">${u.role || "N/A"}</span>
      ${pending ? `<button class="btn approve-admin-btn" data-id="${u.id}" style="margin-top:10px;">Approve Admin ✅</button>` : ""}
    </div>`;
}

function render(users) {
  if (!users.length) {
    container.innerHTML = `<p class="loading">No users found 🚫</p>`;
    return;
  }
  container.innerHTML = users.map(cardMarkup).join("");
}

observeUsersRealtime((users) => {
  allUsers = users;
  render(allUsers);
});

searchInput.addEventListener("keyup", function () {
  const q = this.value.toLowerCase().trim();
  const filtered = !q ? allUsers : allUsers.filter((u) => `${u.name || ""} ${u.email || ""} ${u.role || ""}`.toLowerCase().includes(q));
  render(filtered);
});

container.addEventListener("click", async (e) => {
  const btn = e.target.closest('.approve-admin-btn');
  if (!btn) return;
  const session = getSession() || {};
  btn.disabled = true;
  btn.textContent = "Approving...";
  try {
    await approveAdminUser(btn.dataset.id, session.email || session.name || "admin");
  } catch (err) {
    console.error(err);
    alert("Approval failed ❌");
    btn.disabled = false;
    btn.textContent = "Approve Admin ✅";
  }
});

window.toggleMenu = function(){
  document.getElementById("sidebar").classList.toggle("active");
}

document.querySelectorAll(".sidebar a").forEach(link=>{
  link.addEventListener("click",()=>{
    if(window.innerWidth < 768){
      document.getElementById("sidebar").classList.remove("active");
    }
  });
});
</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
