</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

<h2>👑 Admin</h2>

<nav>
<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="admin-users.html" class="active">👥 Users</a>
<a href="admin-jobs.html">💼 Jobs</a>

</aside>

<!-- MAIN -->
<main class="main">

<!-- TOP -->
<div class="page-top">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <h1>👥 All Users</h1>
  <input type="text" id="searchUser" placeholder="Search users...">
</div>

<!-- USERS LIST -->
<div id="usersList" class="grid"></div>

</main>

</div>

<script type="module">
import { db, logoutUser } from "./firebase.js";
import {
  getDocs,
  collection
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

// LOGOUT
document.querySelector(".btn").addEventListener("click", logoutUser);

// LOAD USERS
async function loadAllUsers(){

  const container = document.getElementById("usersList");
  container.innerHTML = `<p class="loading">Loading users...</p>`;

  try{

    const snapshot = await getDocs(collection(db,"users"));
    container.innerHTML = "";

    if(snapshot.empty){
      container.innerHTML = `<p class="loading">No users found 🚫</p>`;
      return;
    }

    snapshot.forEach(doc=>{
      const u = doc.data();

      const card = document.createElement("div");
      card.className = "user-card";

      card.innerHTML = `
        <h3>👤 ${u.name || "No Name"}</h3>
        <p>📧 ${u.email || "No Email"}</p>
        <span class="role-badge">${u.role || "N/A"}</span>
      `;

      container.appendChild(card);
    });

  }catch(err){
    console.error(err);
    container.innerHTML = `<p class="loading">Error loading users ❌</p>`;
  }
}

// SEARCH
document.getElementById("searchUser")
.addEventListener("keyup",function(){

  const q = this.value.toLowerCase();
  const users = document.querySelectorAll(".user-card");

  users.forEach(card=>{
    card.style.display =
      card.innerText.toLowerCase().includes(q)
      ? "block"
      : "none";
  });

});

// MOBILE MENU
window.toggleMenu = function(){
  document.getElementById("sidebar").classList.toggle("active");
}

document.querySelectorAll(".sidebar a").forEach(link=>{
  link.addEventListener("click",()=>{
    if(window.innerWidth < 768){
      document.getElementById("sidebar").classList.remove("active");
    }
  });
});

loadAllUsers();
</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
