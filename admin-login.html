<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | SkillBridge AI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="login-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <h2>🚀 SkillBridge AI</h2>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#" class="active">Admin</a>
    </div>
  </nav>

  <!-- LOGIN SECTION -->
  <section class="auth-container">

    <div class="card login-card">

      <!-- TOP ICON -->
      <div>
        <div>
          🛡️
        </div>
      </div>

      <h2>Admin Login</h2>
      <p class="subtitle">
        Control tower access only 🚀
      </p>

      <!-- FORM -->
      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
      />

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter secure password"
      />

      <!-- EXTRA -->
      <div>
        <span class="muted">🔒 Secure Session</span>
        <span class="muted">⚡ Fast Access</span>
      </div>

      <!-- BUTTON -->
      <button
        id="loginBtn"
        class="btn btn-primary"
       
      >
        Login 🔐
      </button>

      <!-- BACK -->
      <p class="bottom-text">
        <a href="index.html">← Back Home</a>
      </p>

    </div>

  </section>

  <!-- FOOTER -->
  <footer class="footer">
    © 2026 SkillBridge AI • Admin Portal
  </footer>
<script type="module">
import { loginUser } from "./firebase.js";

// 🔐 LOGIN BUTTON
document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const btn = document.getElementById("loginBtn");

    const user = await loginUser(btn, "admin");

    if (!user) {
      alert("Invalid Admin Credentials 🚫");
      return;
    }

    localStorage.setItem("role", "admin");

  });


// 🔥 LOGOUT FUNCTION (GLOBAL)
window.logout = function(){
  localStorage.clear();   // 🧹 full clean
  window.location.href = "index.html";
};



// Secret signup route for admins only
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "S" || e.key === "s")) {
    window.location.href = "admin-signup.html";
  }
});
</script>
</body>
</html>
