<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraud & Flags | SkillBridge AI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="universal.css">
<style>
  .page-top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.75rem; margin-bottom:1.25rem; }
  .page-top h1 { margin:0; }

  .flags-card {
    background:rgba(18,12,48,.72); border:1px solid rgba(124,58,237,.22); border-radius:16px;
    padding:1.4rem; margin-bottom:1rem;
  }
  .flags-card h3 { font-size:15px; font-weight:700; color:#f5f3ff; margin-bottom:1rem; }

  .flag-row {
    display:flex; align-items:flex-start; gap:1rem; padding:1rem;
    background:rgba(30,18,80,.5); border:1px solid rgba(248,113,113,.2);
    border-radius:12px; margin-bottom:.65rem; flex-wrap:wrap;
  }
  .flag-row:last-child { margin-bottom:0; }
  .flag-icon { font-size:20px; flex-shrink:0; }
  .flag-info { flex:1; min-width:160px; }
  .flag-info .flag-user { font-size:14px; font-weight:700; color:#f5f3ff; }
  .flag-info .flag-reason { font-size:13px; color:#a78bfa; margin-top:.2rem; }
  .flag-info .flag-time   { font-size:12px; color:#6b7280; margin-top:.15rem; }
  .flag-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }

  .btn-ban {
    padding:.45rem 1rem; border-radius:8px; font-size:13px; font-weight:700;
    background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); color:#f87171;
    cursor:pointer; transition:background .2s;
  }
  .btn-ban:hover { background:rgba(239,68,68,.25); }

  .btn-ignore {
    padding:.45rem 1rem; border-radius:8px; font-size:13px; font-weight:700;
    background:rgba(124,58,237,.12); border:1px solid rgba(124,58,237,.3); color:#c4b5fd;
    cursor:pointer; transition:background .2s;
  }
  .btn-ignore:hover { background:rgba(124,58,237,.22); }

  .empty-state {
    text-align:center; padding:2.5rem 1rem; color:#6b7280; font-size:14px;
  }
  .empty-state .icon { font-size:36px; display:block; margin-bottom:.75rem; }

  /* Stats row */
  .stats-mini { display:flex; gap:.75rem; margin-bottom:1rem; flex-wrap:wrap; }
  .stat-mini {
    flex:1; min-width:110px; background:rgba(18,12,48,.72); border:1px solid rgba(124,58,237,.22);
    border-radius:12px; padding:.9rem 1.1rem; text-align:center;
  }
  .stat-mini h4 { font-size:12px; color:#a78bfa; font-weight:600; margin-bottom:.3rem; }
  .stat-mini p  { font-size:28px; font-weight:800; color:#f5f3ff; margin:0; line-height:1; }

  /* Toast */
  .toast {
    position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999;
    padding:.9rem 1.3rem; border-radius:12px; font-size:14px; font-weight:600;
    box-shadow:0 8px 32px rgba(0,0,0,.4); opacity:0; transform:translateY(12px);
    transition:opacity .3s, transform .3s; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast-success { background:#065f46; border:1px solid #4ade80; color:#4ade80; }
  .toast-error   { background:#450a0a; border:1px solid #f87171; color:#f87171; }
</style>
</head>

<body>
<script>
  if (localStorage.getItem("role") !== "admin") { window.location.href = "index.html"; }
</script>

<div class="dashboard">

<aside class="sidebar" id="sidebar">
  <h2>👑 Admin Panel</h2>
  <nav>
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-users.html">👥 Users</a>
    <a href="admin-jobs.html">💼 Jobs</a>
    <a href="admin-applications.html">📄 Apps</a>
    <a href="admin-flags.html" class="active">🚨 Flags</a>
    <a href="admin-analytics.html">📈 Analytics</a>
    <a href="admin-ai-control.html">🤖 AI</a>
    <a href="admin-leaderboard.html">🏆 Rank</a>
    <a href="admin-settings.html">⚙ Settings</a>
    <a href="admin-logs.html">📜 Logs</a>
    <a href="admin-notifications.html">📩 Notify</a>
    <a href="admin-moderation.html">🛠 Mod</a>
  </nav>
  <button onclick="logout()">Logout 👋</button>
</aside>

<main class="main">

  <div class="page-top">
    <div>
      <h1>🚨 Fraud Detection</h1>
      <p style="color:#a78bfa;font-size:14px;margin:.2rem 0 0">Review flagged accounts and take action</p>
    </div>
    <button class="btn-ignore" onclick="loadFlags()" style="padding:.55rem 1.1rem">🔄 Refresh</button>
  </div>

  <!-- Mini stats -->
  <div class="stats-mini">
    <div class="stat-mini"><h4>🚨 Total Flags</h4><p id="totalFlags">—</p></div>
    <div class="stat-mini"><h4>⏳ Pending</h4><p id="pendingFlags">—</p></div>
    <div class="stat-mini"><h4>✅ Resolved</h4><p id="resolvedFlags">—</p></div>
  </div>

  <div class="flags-card">
    <h3>⚠️ Flagged Accounts</h3>
    <div id="flagsList"><div class="empty-state"><span class="icon">🔍</span>Loading flags...</div></div>
  </div>

</main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection, getDocs, deleteDoc, doc, updateDoc, addDoc, query, where
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `toast toast-${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3200);
}

function formatTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" }) + " " +
    d.toLocaleTimeString("en-US", { hour:"2-digit", minute:"2-digit" });
}

window.loadFlags = async function() {
  const list = document.getElementById("flagsList");
  list.innerHTML = `<div class="empty-state"><span class="icon">🔍</span>Loading...</div>`;

  try {
    const snapshot = await getDocs(collection(db, "flags"));
    const flags = [];
    snapshot.forEach(d => flags.push({ id: d.id, ...d.data() }));

    const active   = flags.filter(f => f.status !== "ignored" && f.status !== "banned");
    const ignored  = flags.filter(f => f.status === "ignored" || f.status === "banned");

    document.getElementById("totalFlags").textContent   = flags.length;
    document.getElementById("pendingFlags").textContent = active.length;
    document.getElementById("resolvedFlags").textContent = ignored.length;

    if (active.length === 0) {
      list.innerHTML = `<div class="empty-state"><span class="icon">✅</span>No active flags. Platform looks clean!</div>`;
      return;
    }

    list.innerHTML = active.map(f => `
      <div class="flag-row">
        <div class="flag-icon">🚩</div>
        <div class="flag-info">
          <div class="flag-user">${f.userEmail || f.email || "Unknown user"}</div>
          <div class="flag-reason">${f.reason || "No reason provided"}</div>
          <div class="flag-time">${formatTime(f.createdAt)}</div>
        </div>
        <div class="flag-actions">
          <button class="btn-ban" onclick="banUser('${f.id}','${f.userEmail || f.email || ""}')">🚫 Ban</button>
          <button class="btn-ignore" onclick="ignoreFlag('${f.id}')">✓ Ignore</button>
        </div>
      </div>
    `).join("");

  } catch(e) {
    console.error(e);
    list.innerHTML = `<div class="empty-state"><span class="icon">❌</span>Failed to load flags. Check console.</div>`;
  }
}

window.banUser = async function(id, email) {
  try {
    // Mark flag as banned
    await updateDoc(doc(db, "flags", id), { status: "banned" });

    // Actually suspend the user in the users collection
    if (email) {
      const userSnap = await getDocs(query(collection(db, "users"), where("email", "==", email)));
      userSnap.forEach(async userDoc => {
        await updateDoc(doc(db, "users", userDoc.id), { suspended: true, suspendedAt: Date.now() });
      });
    }

    await addDoc(collection(db, "logs"), {
      action: "User Banned via Flags",
      user: email,
      status: "success",
      createdAt: Date.now()
    });
    showToast(`🚫 ${email || "User"} has been banned and account suspended.`, "success");
    loadFlags();
  } catch(e) {
    console.error(e);
    showToast("Failed to ban user.", "error");
  }
}

window.ignoreFlag = async function(id) {
  try {
    await updateDoc(doc(db, "flags", id), { status: "ignored" });
    showToast("✓ Flag dismissed.", "success");
    loadFlags();
  } catch(e) {
    console.error(e);
    showToast("Failed to dismiss flag.", "error");
  }
}

loadFlags();
</script>

<script>
function logout() { localStorage.clear(); window.location.href = "index.html"; }
function toggleMenu() { document.getElementById("sidebar").classList.toggle("active"); }
document.querySelectorAll(".sidebar a").forEach(link => {
  link.addEventListener("click", () => {
    if (window.innerWidth < 768) document.getElementById("sidebar").classList.remove("active");
  });
});
</script>
<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
