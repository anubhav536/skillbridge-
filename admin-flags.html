<main class="main">

<div class="top">
<span class="menu-btn" onclick="toggleMenu()">☰</span>
<h2>🚨 Fraud Detection Panel</h2>
</div>

<!-- USERS -->
<div class="card">
<h3>⚠️ Suspicious Users</h3>

<table>
<thead>
<tr>
<th>User</th>
<th>Issue</th>
<th>Action</th>
</tr>
</thead>

<tbody id="flagsTable"></tbody>

</table>
</div>

</main>
</div>

<script type="module">

import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  addDoc
} from "./database.js";

// 🔥 LOAD FLAGS
async function loadFlags(){
  const container = document.getElementById("flagsTable");
  container.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";

  const snapshot = await getDocs(collection(db,"flags"));
  container.innerHTML = "";

  snapshot.forEach(docSnap=>{
    const data = docSnap.data();

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${data.userEmail || "-"}</td>
      <td>${data.reason || "-"}</td>
      <td>
        <button class="btn btn-danger" onclick="banUser('${docSnap.id}','${data.userEmail}')">Ban</button>
        <button class="btn" onclick="ignoreFlag('${docSnap.id}')">Ignore</button>
      </td>
    `;

    container.appendChild(row);
  });
}

// 🚫 BAN USER
window.banUser = async function(id,email){

  await deleteDoc(doc(db,"flags",id));

  await addDoc(collection(db,"logs"),{
    action:"User Banned",
    user:email,
    status:"success",
    createdAt:Date.now()
  });

  loadFlags();
}

// ✅ IGNORE
window.ignoreFlag = async function(id){

  await updateDoc(doc(db,"flags",id),{
    status:"ignored"
  });

  loadFlags();
}

loadFlags();

</script>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
}

document.querySelectorAll(".sidebar a").forEach(link=>{
  link.addEventListener("click",()=>{
    if(window.innerWidth < 768){
      document.getElementById("sidebar").classList.remove("active");
    }
  });
});
</script>
