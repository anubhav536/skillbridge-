<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge AI</title>
<link rel="stylesheet" href="style.css?v=97">
  <link rel="stylesheet" href="universal.css">


</head>

<body class="rec-signup-page">

<!-- NAVBAR -->
<nav class="navbar">

  <h2>🚀 SkillBridge AI</h2>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </div>

</nav>

<!-- SIGNUP -->
<section class="auth-container">

  <div class="card signup-card">

    <div class="signup-badge">
      🏢 Recruiter Onboarding
    </div>

    <h2>Recruiter Signup</h2>

    <p class="subtitle">
      Create your hiring HQ and start posting jobs instantly 🎯
    </p>

    <div class="signup-form">

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password">
      </div>

      <button id="signupBtn" class="signup-btn">
        Signup 🚀
      </button>

    </div>

    <!-- STATS -->
    <div class="trust-row">

      <div class="trust-box">
        <h4>10K+</h4>
        <p>Applicants</p>
      </div>

      <div class="trust-box">
        <h4>500+</h4>
        <p>Recruiters</p>
      </div>

      <div class="trust-box">
        <h4>24/7</h4>
        <p>AI Support</p>
      </div>

    </div>

    <p class="bottom-text">
      Already have an account?
      <a href="recruiter-login.html">Login</a>
    </p>

  </div>

</section>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 SkillBridge AI</p>
</footer>
<script type="module">

import {
  signupUser
} from "./firebase.js";


// 🚀 SIGNUP BUTTON
document.getElementById("signupBtn")
.addEventListener("click", async () => {

  const btn = document.getElementById("signupBtn");

  const user = await signupUser(
    "recruiter",
    btn
  );

  if(user){

    // ✅ ROLE SET
    localStorage.setItem("role", "recruiter");

    // 🚀 Direct dashboard entry
    window.location.href = "rec-dashboard.html";

  } else {
    alert("Signup Failed ❌");
  }

});

</script>



<script>
// Secret admin access (not visible in UI)
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) {
    window.location.href = "admin-login.html";
  }
});

// Secret admin signup: Ctrl + Shift + S
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "S" || e.key === "s")) {
    window.location.href = "admin-signup.html";
  }
});
</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
