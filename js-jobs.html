<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs | SkillBridge AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="universal.css">
  <style>
    /* ── Tab Bar ── */
    .tab-bar {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.25rem;
      background: rgba(18,12,48,.6);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 14px;
      padding: .35rem;
    }
    .tab-btn {
      flex: 1;
      padding: .62rem 1rem;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #a78bfa;
      cursor: pointer;
      transition: all .2s;
      box-shadow: none;
      transform: none !important;
      width: auto;
    }
    .tab-btn:hover { background: rgba(124,58,237,.18); color: #ede9fe; }
    .tab-btn.active {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124,58,237,.4);
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: .75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filter-bar input  { flex: 1; min-width: 180px; margin: 0; }
    .filter-bar select { width: 160px; margin: 0; }

    /* ── Mini stats ── */
    .mini-stats {
      display: flex;
      gap: .75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .mini-box {
      background: rgba(124,58,237,.1);
      border: 1px solid rgba(124,58,237,.22);
      border-radius: 10px;
      padding: .6rem 1.1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: 14px;
    }
    .mini-box span { font-size: 22px; font-weight: 800; color: #c4b5fd; }
    .mini-box small { color: #a78bfa; }

    /* ── Jobs grid ── */
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    /* ── Job card ── */
    .job-card {
      background: rgba(18,12,48,.72);
      border: 1px solid rgba(124,58,237,.22);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      transition: box-shadow .25s, transform .25s;
      position: relative;
      overflow: hidden;
    }
    .job-card:hover {
      box-shadow: 0 0 32px rgba(124,58,237,.25);
      transform: translateY(-2px);
    }
    .job-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7c3aed, #4f46e5);
      border-radius: 16px 16px 0 0;
    }

    .job-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: .5rem;
    }
    .job-head h3 {
      font-size: 16px;
      font-weight: 700;
      color: #f5f3ff;
      margin: 0;
      line-height: 1.3;
    }
    .job-chip {
      font-size: 11px;
      font-weight: 700;
      padding: .28rem .65rem;
      border-radius: 999px;
      background: rgba(124,58,237,.2);
      border: 1px solid rgba(124,58,237,.4);
      color: #c4b5fd;
      white-space: nowrap;
    }

    /* ── Match score bar ── */
    .match-row {
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .match-bar-wrap {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .match-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .6s ease;
    }
    .match-pct {
      font-size: 13px;
      font-weight: 800;
      min-width: 38px;
      text-align: right;
    }
    .match-label-txt {
      font-size: 11.5px;
      font-weight: 600;
      padding: .2rem .6rem;
      border-radius: 999px;
      border: 1px solid currentColor;
      opacity: .85;
    }

    .company { font-size: 13.5px; color: #a78bfa; margin: 0; }
    .meta-row { display: flex; gap: .5rem; flex-wrap: wrap; font-size: 13px; color: #a78bfa; }

    .tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      font-size: 12px;
      padding: .22rem .6rem;
      border-radius: 999px;
      background: rgba(124,58,237,.14);
      border: 1px solid rgba(124,58,237,.3);
      color: #c4b5fd;
      font-weight: 500;
    }
    .tag.matched {
      background: rgba(74,222,128,.12);
      border-color: rgba(74,222,128,.35);
      color: #4ade80;
    }
    .tag.missing {
      background: rgba(248,113,113,.08);
      border-color: rgba(248,113,113,.25);
      color: #f87171;
    }

    .job-actions { margin-top: auto; display: flex; gap: .6rem; }
    .applyBtn {
      flex: 1;
      padding: .68rem;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      box-shadow: 0 4px 14px rgba(124,58,237,.35);
      width: auto;
    }
    .applyBtn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
    .done-btn {
      background: rgba(74,222,128,.15) !important;
      border: 1px solid rgba(74,222,128,.35) !important;
      color: #4ade80 !important;
      box-shadow: none !important;
    }

    /* ── No skills banner ── */
    .no-skills-banner {
      background: rgba(245,158,11,.1);
      border: 1px solid rgba(245,158,11,.35);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      font-size: 14px;
      color: #fcd34d;
    }
    .no-skills-banner a {
      background: rgba(245,158,11,.25);
      border: 1px solid rgba(245,158,11,.45);
      color: #fcd34d;
      padding: .45rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    /* ── Empty / loading states ── */
    .loading-text {
      color: #a78bfa;
      text-align: center;
      padding: 3rem 1rem;
      font-size: 15px;
      grid-column: 1/-1;
    }

    /* ── Page header ── */
    .jobs-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    .jobs-top h1 { margin: 0; }
    .jobs-top p  { margin: .2rem 0 0; font-size: 14px; color: #a78bfa; }
  </style>
</head>

<body class="jobs-page">
<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>👨‍🎓 Job Seeker Panel</h2>
    <nav>
      <a href="js-dashboard.html">Dashboard</a>
      <a href="js-jobs.html" class="active">Jobs</a>
      <a href="js-applications.html">Applications</a>
      <a href="js-resume.html">Resume Builder</a>
      <a href="js-analytics.html">Analytics</a>
      <a href="js-profile.html">Profile</a>
    </nav>
    <button id="logoutBtn">Logout 👋</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOP -->
    <div class="jobs-top">
      <div>
        <h1>💼 Available Jobs</h1>
        <p id="welcomeSkills">Loading your match profile...</p>
      </div>
      <div class="badge">🤖 AI Matching Active</div>
    </div>

    <!-- NO SKILLS WARNING -->
    <div id="noSkillsBanner" class="no-skills-banner" style="display:none">
      ⚠️ Your profile has no skills — AI matching won't work until you add them.
      <a href="js-profile.html">Add Skills →</a>
    </div>

    <!-- TABS -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabAll"       onclick="switchTab('all')">📋 All Jobs</button>
      <button class="tab-btn"        id="tabMatched"   onclick="switchTab('matched')">🎯 AI Matched</button>
      <button class="tab-btn"        id="tabTop"       onclick="switchTab('top')">🔥 Best Fits (60%+)</button>
    </div>

    <!-- FILTERS -->
    <div class="filter-bar">
      <input type="text" id="search">
      <select id="sortJobs">
        <option value="match">Best Match First</option>
        <option value="new">Newest First</option>
        <option value="az">A to Z</option>
      </select>
    </div>

    <!-- MINI STATS -->
    <div class="mini-stats">
      <div class="mini-box"><span id="totalJobs">0</span><small>Total Jobs</small></div>
      <div class="mini-box"><span id="shownJobs">0</span><small>Showing</small></div>
      <div class="mini-box"><span id="matchedJobs">0</span><small>AI Matched (40%+)</small></div>
    </div>

    <!-- JOBS -->
    <div id="jobsContainer" class="jobs-grid">
      <p class="loading-text">Loading jobs...</p>
    </div>

  </main>
</div>

<script type="module">
import { db, getSession, applyJob, logoutUser } from "./firebase.js";
import { getDocs, collection } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
import { rankJobs, getSkillGap, matchLabel, parseSkills } from "./ai-match.js";

/* ── Auth ── */
const user = getSession();
if (!user) { window.location.href = "jobseeker-login.html"; }
if (user && user.role !== "jobseeker") { window.location.href = "index.html"; }

document.getElementById("logoutBtn").addEventListener("click", logoutUser);

/* ── State ── */
let allJobs      = [];
let rankedJobs   = [];
let appliedJobIds = new Set();
let currentTab   = "all";
const userSkills = user?.skills || "";

/* ── Tab switch ── */
window.switchTab = function(tab) {
  currentTab = tab;
  ["all","matched","top"].forEach(t => {
    document.getElementById("tab" + t.charAt(0).toUpperCase() + t.slice(1))
      .classList.toggle("active", t === tab);
  });
  filterJobs();
};

/* ── Init ── */
window.addEventListener("DOMContentLoaded", async () => {

  // Show skills status
  const parsed = parseSkills(userSkills);
  if (parsed.length === 0) {
    document.getElementById("noSkillsBanner").style.display = "flex";
    document.getElementById("welcomeSkills").textContent = "Add skills to enable AI matching";
  } else {
    document.getElementById("welcomeSkills").textContent =
      `Matching against your ${parsed.length} skill${parsed.length > 1 ? "s" : ""}: ${parsed.slice(0,4).join(", ")}${parsed.length > 4 ? "…" : ""}`;
  }

  await loadAppliedJobs();
  await loadJobs();

  document.getElementById("search").addEventListener("input", filterJobs);
  document.getElementById("sortJobs").addEventListener("change", filterJobs);
});

/* ── Load applied ── */
async function loadAppliedJobs() {
  if (!user?.email) return;
  const email = user.email.toLowerCase();
  const saved = JSON.parse(localStorage.getItem(`appliedJobs:${email}`)) || [];
  appliedJobIds = new Set(saved);

  try {
    const snap = await getDocs(collection(db, "applications"));
    snap.forEach(d => {
      const a = d.data();
      const ae = (a.userEmail || a.seeker || a.email || "").toLowerCase();
      if (ae === email && a.jobId) appliedJobIds.add(a.jobId.toString().trim());
    });
    localStorage.setItem(`appliedJobs:${email}`, JSON.stringify([...appliedJobIds]));
  } catch(e) { console.error(e); }
}

/* ── Load jobs ── */
async function loadJobs() {
  document.getElementById("jobsContainer").innerHTML =
    `<p class="loading-text">🤖 AI is analysing your fit...</p>`;
  try {
    const snap = await getDocs(collection(db, "jobs"));
    const raw  = [];
    snap.forEach(d => raw.push({ id: d.id, ...d.data() }));

    // Rank by match
    rankedJobs = rankJobs(raw, userSkills);
    allJobs    = rankedJobs;

    document.getElementById("totalJobs").textContent   = allJobs.length;
    document.getElementById("matchedJobs").textContent =
      allJobs.filter(j => j.matchScore >= 40).length;

    filterJobs();
  } catch(err) {
    console.error(err);
    document.getElementById("jobsContainer").innerHTML =
      `<p class="loading-text">Failed to load jobs ❌</p>`;
  }
}

/* ── Filter + sort ── */
function filterJobs() {
  const search = document.getElementById("search").value.toLowerCase().trim();
  const sort   = document.getElementById("sortJobs").value;

  let jobs = [...allJobs];

  // Tab filter
  if (currentTab === "matched") jobs = jobs.filter(j => j.matchScore >= 40);
  if (currentTab === "top")     jobs = jobs.filter(j => j.matchScore >= 60);

  // Search
  if (search) {
    jobs = jobs.filter(j =>
      (j.title || "").toLowerCase().includes(search) ||
      (j.recruiter || "").toLowerCase().includes(search) ||
      (Array.isArray(j.skills) ? j.skills.join(" ").toLowerCase() : "").includes(search)
    );
  }

  // Sort
  if (sort === "match") {
    jobs.sort((a,b) => b.matchScore - a.matchScore);
  } else if (sort === "az") {
    jobs.sort((a,b) => (a.title||"").localeCompare(b.title||""));
  } else {
    jobs.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  document.getElementById("shownJobs").textContent = jobs.length;
  renderJobs(jobs);
}

/* ── Render ── */
function renderJobs(jobs) {
  const container = document.getElementById("jobsContainer");

  if (jobs.length === 0) {
    const msg = currentTab !== "all"
      ? `<p class="loading-text">No jobs found for this filter 😢<br><small style="color:#a78bfa">Try "All Jobs" tab or add more skills in Profile</small></p>`
      : `<p class="loading-text">No jobs found 😢</p>`;
    container.innerHTML = msg;
    return;
  }

  container.innerHTML = jobs.map((job, idx) => {
    const applied  = appliedJobIds.has(job.id);
    const score    = job.matchScore ?? 0;
    const ml       = matchLabel(score);
    const hasSkills = parseSkills(userSkills).length > 0;
    const { matched, missing } = hasSkills
      ? getSkillGap(userSkills, job.skills)
      : { matched: [], missing: [] };

    const allJobSkills = Array.isArray(job.skills) ? job.skills : parseSkills(job.skills);

    const skillTags = allJobSkills.map(s => {
      const isMatch = matched.includes(s.toLowerCase().trim());
      return `<span class="tag ${hasSkills ? (isMatch ? 'matched' : 'missing') : ''}">${s}</span>`;
    }).join("");

    const matchBar = hasSkills ? `
      <div class="match-row">
        <div class="match-bar-wrap">
          <div class="match-bar-fill" style="width:${score}%;background:${ml.color}"></div>
        </div>
        <span class="match-pct" style="color:${ml.color}">${score}%</span>
        <span class="match-label-txt" style="color:${ml.color};border-color:${ml.color}">${ml.label}</span>
      </div>` : "";

    const salary   = job.salary   ? `💰 ${job.salary}`   : "";
    const location = job.location ? `📍 ${job.location}` : "";

    return `
    <div class="job-card">
      <div class="job-head">
        <h3>${job.title || "Untitled Job"}</h3>
        <span class="job-chip">🔥 Hiring</span>
      </div>
      <p class="company">🏢 ${job.recruiter || "Company"}</p>
      ${(salary || location) ? `<div class="meta-row">${salary ? `<span>${salary}</span>` : ""}${location ? `<span>${location}</span>` : ""}</div>` : ""}
      ${matchBar}
      ${skillTags ? `<div class="tags">${skillTags}</div>` : ""}
      <div class="job-actions">
        <button class="applyBtn ${applied ? 'done-btn' : ''}"
          data-index="${idx}" ${applied ? "disabled" : ""}>
          ${applied ? "✅ Applied" : "Apply Now →"}
        </button>
      </div>
    </div>`;
  }).join("");

  attachApplyEvents(jobs);
}

/* ── Apply ── */
function attachApplyEvents(jobs) {
  document.querySelectorAll(".applyBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const idx = Number(btn.dataset.index);
      const job = jobs[idx];
      if (!user) { location.href = "jobseeker-login.html"; return; }
      if (appliedJobIds.has(job.id)) { alert("Already applied ⚠️"); return; }

      btn.disabled = true;
      btn.textContent = "Applying...";

      try {
        await applyJob({
          jobId:    job.id,
          jobTitle: job.title || "",
          recruiter: job.recruiter || "",
          seeker:   user.email,
          user:     user.email,
          skills:   job.skills || [],
          matchScore: job.matchScore ?? 0,
          status:   "Applied"
        });

        appliedJobIds.add(job.id);
        localStorage.setItem(
          `appliedJobs:${user.email.toLowerCase()}`,
          JSON.stringify([...appliedJobIds])
        );
        btn.textContent = "✅ Applied";
        btn.classList.add("done-btn");
      } catch(err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = "Apply Now →";
        alert("Application failed ❌");
      }
    });
  });
}
</script>
<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
