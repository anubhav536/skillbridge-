<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Applications | SkillBridge AI</title>


  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="universal.css">
</head>

<body>

<div class="dashboard">

<aside class="sidebar">
<h2>👑 Admin</h2>

<nav>
<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="admin-users.html">👥 Users</a>
<a href="admin-jobs.html">💼 Jobs</a>
<a href="admin-applications.html" class="active">📄 Applications</a>
</nav>
</aside>

<main class="main">

<div class="top">
<h2>📄 Applications Panel</h2>
<span class="badge">Live</span>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Skill</th>
<th>Experience</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="appTable"></tbody>

</table>
</div>

</main>
</div>
<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";


// ✅ FIXED ID
const table = document.getElementById("appTable");


// 🧠 SAFE PICK
function pick(...values) {
  for (let v of values) {
    if (v !== undefined && v !== null && v !== "") {
      return v;
    }
  }
  return "N/A";
}


// 📥 LOAD
async function loadApplications() {

  try {

    table.innerHTML = `<tr><td colspan="6">Loading...</td></tr>`;

    const snap = await getDocs(collection(db, "applications"));

    if (snap.empty) {
      table.innerHTML = `<tr><td colspan="6">No applications found 🚫</td></tr>`;
      return;
    }

    table.innerHTML = "";

    snap.forEach(d => {

      const app = d.data();

      const name = pick(app.name, app.fullName);
      const email = pick(app.email, app.userEmail);
      const skills = pick(
        Array.isArray(app.skills) ? app.skills.join(", ") : app.skills,
        app.skill
      );
      const experience = pick(app.experience, app.exp);
      const status = pick(app.status, "pending");

      table.innerHTML += `
      <tr>
        <td>${name}</td>
        <td>${email}</td>
        <td>${skills}</td>
        <td>${experience}</td>
        <td>
          <span class="status ${status}">
            ${status}
          </span>
        </td>
        <td class="actions">
          ${(status === "pending") ? `
            <button class="accept" onclick="accept('${d.id}')">Accept</button>
            <button class="reject" onclick="reject('${d.id}')">Reject</button>
          ` : ""}
        </td>
      </tr>
      `;

    });

  } catch (e) {
    console.error(e);
    table.innerHTML = `<tr><td colspan="6">Error loading data ❌</td></tr>`;
  }
}


// ✅ ACCEPT
window.accept = async function (id) {
  try {
    await updateDoc(doc(db, "applications", id), {
      status: "approved"   // ⚡ CSS ke saath match
    });

    loadApplications();

  } catch (e) {
    console.error(e);
    alert("Error ❌");
  }
};


// ❌ REJECT
window.reject = async function (id) {
  try {
    await updateDoc(doc(db, "applications", id), {
      status: "rejected"
    });

    loadApplications();

  } catch (e) {
    console.error(e);
    alert("Error ❌");
  }
};


// 🚀 START
loadApplications();

</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
