<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Seeker Login | SkillBridge AI</title>


  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="universal.css">
</head>

<body>

<div class="container">

<h2>👨‍🎓 Job Seeker Login</h2>

<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button id="loginBtn">Login 🚀</button>

<p><a href="#" id="forgotPassword">Forgot Password?</a></p>

<p>Don't have account? <a href="jobseeker-signup.html">Signup</a></p>

</div>

<script type="module">
import { loginUser, resetPassword } from "./firebase.js";

// LOGIN
document.getElementById("loginBtn")
.addEventListener("click", async () => {

  console.log("Login clicked");

  const btn = document.getElementById("loginBtn");
  await loginUser(btn, "jobseeker");
});


// FORGOT PASSWORD
document.getElementById("forgotPassword")
.addEventListener("click", (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  if(!email){
    alert("Enter email first");
    return;
  }

  resetPassword(email);
});
</script>



<script>
// Secret admin access (not visible in UI)
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) {
    window.location.href = "admin-login.html";
  }
});

// Secret admin signup: Ctrl + Shift + S
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "S" || e.key === "s")) {
    window.location.href = "admin-signup.html";
  }
});
</script>

</body>
</html>
