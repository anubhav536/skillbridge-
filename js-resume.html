<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ULTRA PRO Resume Builder | SkillBridge AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="style.css?v=200">
  <link rel="stylesheet" href="universal.css">


</head>

<body class="resume-page">

<div class="resume-wrap">

<div class="pro-top">

<div class="pro-box">
<h1>📄 ULTRA PRO Resume Builder</h1>
<p>Recruiter magnet mode activated 🚀</p>
</div>

<div class="pro-box">
<p>Templates: Corporate • Modern • Classic</p>
<p>ATS • PDF • QR • Photo • Auto Skills</p>
</div>

</div>


<div class="pro-grid">

<!-- ================= FORM ================= -->

<div class="pro-form">

<form id="resumeForm">

<label>Full Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Phone</label>
<input type="text" id="phone">

<label>LinkedIn URL</label>
<input type="text" id="linkedin">

<label>Skills</label>
<input type="text" id="skills" placeholder="HTML, CSS, JavaScript">

<label>Education</label>
<textarea id="education"></textarea>

<label>Experience</label>
<textarea id="experience"></textarea>

<label>Projects</label>
<textarea id="projects"></textarea>

<label>Achievements</label>
<textarea id="achievements"></textarea>

<label>Career Objective</label>
<textarea id="objective"></textarea>

<label>Theme</label>
<select id="theme">
<option value="blue">Corporate Blue</option>
<option value="green">Growth Green</option>
<option value="dark">Executive Dark</option>
</select>

<label>Photo</label>
<input type="file" id="photo" accept="image/*">

<button type="submit" class="pro-btn">
Generate Resume 🚀
</button>

<button type="button" id="pdfBtn" class="pro-btn download-btn">
Download PDF 🖨️
</button>

</form>

</div>


<!-- ================= PREVIEW ================= -->

<div class="preview-shell">
<div id="resumePreview"></div>
</div>

</div>

</div>


<script>

const form = document.getElementById("resumeForm");
const preview = document.getElementById("resumePreview");
let photoURL = "";

document.getElementById("photo").addEventListener("change", e => {

  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(ev){
    photoURL = ev.target.result;
  };

  reader.readAsDataURL(file);

});


function bullets(text){

  if(!text.trim()) return "<li>Not specified</li>";

  return text.split(".")
  .filter(x => x.trim())
  .map(x => `<li>${x.trim()}</li>`)
  .join("");

}

function themeColor(theme){

  if(theme === "green"){
    return "linear-gradient(180deg,#16a34a,#15803d,#14532d)";
  }

  if(theme === "dark"){
    return "linear-gradient(180deg,#111827,#1f2937,#000)";
  }

  return "linear-gradient(180deg,#1d4ed8,#1e40af,#172554)";

}


form.addEventListener("submit", (e) => {
  
  e.preventDefault();
  
  const fullName =
    document.getElementById("name").value.trim() || "Your Name";
  
  const email =
    document.getElementById("email").value.trim();
  
  const phone =
    document.getElementById("phone").value.trim();
  
  const linkedin =
    document.getElementById("linkedin").value.trim();
  
  const skills =
    document.getElementById("skills").value
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);
  
  const education =
    document.getElementById("education").value.trim();
  
  const experience =
    document.getElementById("experience").value.trim();
  
  const projects =
    document.getElementById("projects").value.trim();
  
  const achievements =
    document.getElementById("achievements").value.trim();
  
  const objective =
    document.getElementById("objective").value.trim();
  
  const theme =
    document.getElementById("theme").value;
  
  const ats =
    Math.min(
      100,
      40 + skills.length * 7 +
      (experience.length > 20 ? 20 : 0) +
      (projects.length > 20 ? 20 : 0)
    );
  
  preview.innerHTML = `
<div class="cv">

<div class="cv-left">

${photoURL
? `<img src="${photoURL}" class="photo">`
: `<div class="avatar">👤</div>`
}

<h1>${fullName}</h1>
<p>${email}</p>
<p>${phone}</p>

<h3>ATS Score</h3>
<p>${ats}/100</p>

</div>

<div class="cv-right">

<h2>Professional Resume</h2>

<div class="section">
<h3>Career Objective</h3>
<p>${objective}</p>
</div>

<div class="section">
<h3>Education</h3>
<p>${education}</p>
</div>

<div class="section">
<h3>Experience</h3>
<ul>${bullets(experience)}</ul>
</div>

<div class="section">
<h3>Projects</h3>
<ul>${bullets(projects)}</ul>
</div>

<div class="section">
<h3>Achievements</h3>
<ul>${bullets(achievements)}</ul>
</div>

</div>

</div>
`;
  
});


document.getElementById("pdfBtn")
  .addEventListener("click", async () => {
    
    const element =
      document.getElementById("resumePreview");
    
    if (!element.innerHTML.trim()) {
      alert("Generate resume first ❌");
      return;
    }
    
    const btn = document.getElementById("pdfBtn");
    btn.disabled = true;
    btn.innerText = "Preparing PDF...";
    
    /* force visible */
    element.style.display = "block";
    element.style.background = "#ffffff";
    element.style.color = "#111";
    
    /* wait render */
    await new Promise(r => setTimeout(r, 1500));
    
    const opt = {
      margin: 0,
      filename: "Ultra_Pro_Resume.pdf",
      
      image: {
        type: "jpeg",
        quality: 1
      },
      
      html2canvas: {
        scale: 4,
        useCORS: true,
        logging: false,
        letterRendering: true,
        scrollX: 0,
        scrollY: 0,
        backgroundColor: "#ffffff"
      },
      
      jsPDF: {
        unit: "px",
        format: [794, 1123],
        orientation: "portrait"
      }
    };
    
    try {
      
      await html2pdf()
        .set(opt)
        .from(element)
        .save();
      
    } catch (err) {
      
      console.log(err);
      alert("PDF failed ❌");
      
    }
    
    btn.disabled = false;
    btn.innerText = "Download PDF 🖨️";
    
  });
</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
