<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Jobs | SkillBridge AI</title>


  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="universal.css">
</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
<h2>👑 Admin</h2>

<nav>
<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="admin-users.html">👥 Users</a>
<a href="admin-jobs.html" class="active">💼 Jobs</a>
<a href="admin-applications.html">📄 Apps</a>
<a href="admin-flags.html">🚨 Flags</a>
<a href="admin-analytics.html">📈 Analytics</a>
<a href="admin-ai-control.html">🤖 AI</a>
<a href="admin-leaderboard.html">🏆 Rank</a>
<a href="admin-settings.html">⚙ Settings</a>
<a href="admin-logs.html">📜 Logs</a>
<a href="admin-notifications.html">📩 Notify</a>
<a href="admin-moderation.html">🛠 Mod</a>
</nav>

<button id="logoutBtn" class="btn">Logout 👋</button>

</aside>

<!-- MAIN -->
<main class="main">

<!-- TOP -->
<div class="top">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <h2>💼 All Jobs</h2>
  <span class="badge">Live</span>
</div>

<input type="text" id="searchJob" class="input" placeholder="Search jobs...">

<div id="jobsList"></div>

</main>

</div>

<script type="module">

import { db, logoutUser } from "./firebase.js";

import {
  getDocs,
  collection,
  deleteDoc,
  doc
} from "./database.js";

document.getElementById("logoutBtn")
  .addEventListener("click", logoutUser);


// MOBILE MENU
window.toggleMenu = function(){
  document.getElementById("sidebar").classList.toggle("active");
}

// AUTO CLOSE MENU
document.querySelectorAll(".sidebar a").forEach(link=>{
  link.addEventListener("click",()=>{
    if(window.innerWidth < 768){
      document.getElementById("sidebar").classList.remove("active");
    }
  });
});


// LOAD JOBS
async function loadAllJobs(){

  const container = document.getElementById("jobsList");
  container.innerHTML = `<div class="empty-box">Loading jobs...</div>`;

  try{

    const snapshot = await getDocs(collection(db,"jobs"));

    container.innerHTML = "";

    if(snapshot.empty){
      container.innerHTML = `<div class="empty-box">No jobs found 🚫</div>`;
      return;
    }

    snapshot.forEach(d=>{

      const j = d.data();

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <b>💼 ${j.title || "No Title"}</b><br><br>
        🛠 ${j.skills?.join(", ") || "N/A"}<br>
        💰 ${j.salary || "N/A"}<br>

        <button class="btn deleteBtn">🗑 Delete</button>
      `;

      card.querySelector(".deleteBtn")
        .addEventListener("click", async()=>{

          const ok = confirm("Delete this job?");
          if(!ok) return;

          await deleteDoc(doc(db,"jobs",d.id));
          loadAllJobs();

        });

      container.appendChild(card);

    });

  }catch(err){
    container.innerHTML = `<div class="empty-box">Error loading jobs ❌</div>`;
  }
}


// SEARCH
document.getElementById("searchJob")
  .addEventListener("keyup",function(){

    const q = this.value.toLowerCase();

    document.querySelectorAll(".card")
      .forEach(c=>{
        c.style.display =
          c.innerText.toLowerCase().includes(q)
          ? "block" : "none";
      });

  });

loadAllJobs();

</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
