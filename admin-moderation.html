<main class="main">

<div class="top">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <h2>🛠 Moderation Panel</h2>
</div>

<!-- USERS -->
<div class="card">
<h3>🚫 Reported Users</h3>
<table id="userTable">
<tr><th>User</th><th>Reason</th><th>Action</th></tr>
</table>
</div>

<!-- JOBS -->
<div class="card">
<h3>📛 Reported Jobs</h3>
<table id="jobTable">
<tr><th>Company</th><th>Issue</th><th>Action</th></tr>
</table>
</div>

<!-- CONTROL -->
<div class="card">
<h3>🔒 User Control</h3>
<input type="text" id="emailInput" >
<br><br>
<button class="btn ban" onclick="manualBan()">Ban User</button>
<button class="btn safe" onclick="manualUnban()">Unban User</button>
</div>

</main>
</div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* LOAD DATA */
async function loadModeration(){

  const userTable = document.getElementById("userTable");
  const jobTable = document.getElementById("jobTable");

  const snap = await getDocs(collection(db,"moderation"));

  snap.forEach(d=>{
    const data = d.data();

    if(data.type === "user"){
      userTable.innerHTML += `
      <tr>
        <td>${data.targetId}</td>
        <td>${data.reason}</td>
        <td>
          <button class="btn ban" onclick="ban('${d.id}')">Ban</button>
          <button class="btn ignore" onclick="ignore('${d.id}')">Ignore</button>
        </td>
      </tr>`;
    }

    if(data.type === "job"){
      jobTable.innerHTML += `
      <tr>
        <td>${data.targetId}</td>
        <td>${data.reason}</td>
        <td>
          <button class="btn delete" onclick="removeJob('${d.id}')">Delete</button>
          <button class="btn review" onclick="review('${d.id}')">Review</button>
        </td>
      </tr>`;
    }
  });
}

/* ACTIONS */
window.ban = async(id)=>{
  await updateDoc(doc(db,"moderation",id),{action:"banned"});
  await addDoc(collection(db,"logs"),{
    action:"User Banned",
    createdAt:Date.now()
  });
  location.reload();
}

window.ignore = async(id)=>{
  await deleteDoc(doc(db,"moderation",id));
  location.reload();
}

window.removeJob = async(id)=>{
  await deleteDoc(doc(db,"moderation",id));
  location.reload();
}

window.review = async(id)=>{
  alert("Marked for review");
}

/* MANUAL */
window.manualBan = async()=>{
  const email = document.getElementById("emailInput").value;

  await addDoc(collection(db,"moderation"),{
    type:"user",
    targetId:email,
    action:"banned",
    createdAt:Date.now()
  });

  alert("User banned");
}

window.manualUnban = async()=>{
  alert("Unban logic add later");
}

/* UI */
window.toggleMenu = function(){
  document.getElementById("sidebar").classList.toggle("active");
}

loadModeration();
</script>

<script type="module" src="./app-enhancements.js"></script>
