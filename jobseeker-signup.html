<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge AI</title>
<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="universal.css">


</head>

<body class="js-signup-body">

<!-- NAVBAR -->
<nav class="js-signup-navbar">
  <h2 class="js-signup-logo">🚀 SkillBridge AI</h2>

  <div class="js-signup-navlinks">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </div>
</nav>

<!-- SIGNUP -->
<section class="js-signup-section">

  <div class="js-signup-box">

    <h2>👨‍🎓 Job Seeker Signup</h2>

    <p class="js-signup-subtitle">
      Create your account and unlock your career runway.
    </p>

    <label>Full Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      class="js-signup-input"
    >

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      class="js-signup-input"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create password"
      class="js-signup-input"
    >

    <button id="signupBtn" class="js-signup-btn">
      Signup 🚀
    </button>

    <p class="js-signup-bottom">
      Already have an account?
      <a href="jobseeker-login.html">Login</a>
    </p>

  </div>

</section>

<!-- FOOTER -->
<footer class="js-signup-footer">
  <p>© 2026 SkillBridge AI</p>
</footer>
<script type="module">
import { signupUser } from "./firebase.js";

// 🚀 SIGNUP BUTTON
document.getElementById("signupBtn").addEventListener("click", async () => {
  const btn = document.getElementById("signupBtn");
  await signupUser("jobseeker", btn);
});
</script>



<script>
// Secret admin access (not visible in UI)
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) {
    window.location.href = "admin-login.html";
  }
});

// Secret admin signup: Ctrl + Shift + S
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "S" || e.key === "s")) {
    window.location.href = "admin-signup.html";
  }
});
</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
