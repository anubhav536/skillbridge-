<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Admin Logs | SkillBridge AI</title>


  <link rel="stylesheet" href="style.css" />

</head>

<body>

<div class="dashboard">

<aside class="sidebar" id="sidebar">
<h2>👑 Admin</h2>

<nav>
<a href="admin-dashboard.html">📊 Dashboard</a>
<a href="admin-users.html">👥 Users</a>
<a href="admin-jobs.html">💼 Jobs</a>

</nav>

<a href="index.html" class="btn">Logout 👋</a>
</aside>

<main class="main">

<div class="topbar">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <h2>📜 Activity Logs</h2>
</div>

<div class="card">

<h3>🧾 System Activity</h3>

<table id="logsTable">
<tr>
<th>Time</th>
<th>User</th>
<th>Action</th>
<th>Status</th>
</tr>
</table>

</div>

<div class="card">

<h3>🔍 Filters</h3>

<input type="text" id="filterUser" placeholder="Enter email">
<select id="filterAction">
<option value="">All</option>
<option>Login</option>
<option>Job Post</option>
<option>Delete</option>
</select>

<button class="btn" onclick="applyFilters()">Apply Filters</button>

</div>

</main>
</div>

<script type="module">

import { db } from "./firebase.js";
import {
  collection,
  getDocs
} from "./database.js";

let allLogs = [];

// 🔥 LOAD LOGS
async function loadLogs(){
  const table = document.getElementById("logsTable");

  const snapshot = await getDocs(collection(db,"logs"));

  allLogs = [];

  snapshot.forEach(doc=>{
    const data = doc.data();
    allLogs.push(data);
  });

  renderLogs(allLogs);
}

// 🧠 RENDER
function renderLogs(logs){
  const table = document.getElementById("logsTable");

  table.innerHTML = `
  <tr>
    <th>Time</th>
    <th>User</th>
    <th>Action</th>
    <th>Status</th>
  </tr>`;

  logs.forEach(l=>{
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${l.time || "-"}</td>
      <td>${l.user || "-"}</td>
      <td>${l.action || "-"}</td>
      <td>${l.status || "-"}</td>
    `;

    table.appendChild(row);
  });
}

// 🔍 FILTER
window.applyFilters = function(){

  const user = document.getElementById("filterUser").value.toLowerCase();
  const action = document.getElementById("filterAction").value;

  const filtered = allLogs.filter(log=>{
    return (
      (!user || (log.user && log.user.toLowerCase().includes(user))) &&
      (!action || log.action?.includes(action))
    );
  });

  renderLogs(filtered);
}

// LOAD ON START
loadLogs();

</script>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
}

document.querySelectorAll(".sidebar a").forEach(link=>{
  link.addEventListener("click",()=>{
    if(window.innerWidth < 768){
      document.getElementById("sidebar").classList.remove("active");
    }
  });
});
</script>

<script type="module" src="./app-enhancements.js"></script>
</body>
</html>
